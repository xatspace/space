<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleanos Kane</title>
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset Basico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Estilos base y fondo oscuro elegante */
        body, html {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            background-color: #0d0b14;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Canvas interactivo de fondo para la lluvia de globos */
        #balloon-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Contenedor principal */
        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Encabezado festivo con colores pasteles */
        .header-title {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(2rem, 5vw, 3.2rem);
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #ffb7b2, #ffdac1, #e2f0cb, #b5ead7, #c7ceea);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pastelGradient 6s ease infinite, pulseTitle 2s ease-in-out infinite alternate;
            text-shadow: 0px 4px 15px rgba(255, 183, 178, 0.3);
            letter-spacing: 1px;
        }

        @keyframes pastelGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulseTitle {
            0% { transform: scale(0.98); }
            100% { transform: scale(1.02); }
        }

        /* ========================================================
           RESPONSIVE CONFIGURATION (PC vs MOVIL)
           ======================================================== */

        /* Marco del reproductor con resplandor pastel interactivo */
        .player-card {
            position: relative;
            background: rgba(22, 18, 33, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            animation: pastelGlow 4s ease-in-out infinite alternate;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        /* Animacion suave de iluminacion pastel */
        @keyframes pastelGlow {
            0% {
                border-color: rgba(255, 183, 178, 0.8);
                box-shadow: 0 0 20px rgba(255, 183, 178, 0.4),
                            0 0 40px rgba(181, 234, 215, 0.2),
                            inset 0 0 15px rgba(255, 183, 178, 0.2);
            }
            33% {
                border-color: rgba(199, 206, 234, 0.8);
                box-shadow: 0 0 25px rgba(199, 206, 234, 0.5),
                            0 0 50px rgba(255, 218, 193, 0.3),
                            inset 0 0 15px rgba(199, 206, 234, 0.2);
            }
            66% {
                border-color: rgba(226, 240, 203, 0.8);
                box-shadow: 0 0 20px rgba(226, 240, 203, 0.4),
                            0 0 40px rgba(255, 183, 178, 0.2),
                            inset 0 0 15px rgba(226, 240, 203, 0.2);
            }
            100% {
                border-color: rgba(255, 218, 193, 0.8);
                box-shadow: 0 0 25px rgba(255, 218, 193, 0.5),
                            0 0 45px rgba(199, 206, 234, 0.3),
                            inset 0 0 15px rgba(255, 218, 193, 0.2);
            }
        }

        /* Contenedor del video con aspecto 16:9 */
        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            overflow: hidden;
            background-color: #000;
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 16px;
        }

        /* CONFIGURACION PC (Ancho maximo fijo de 720px centrado) */
        @media screen and (min-width: 768px) {
            .player-card {
                width: 720px;
                max-width: 720px;
                margin: 0 auto;
                padding: 16px;
            }
        }

        /* CONFIGURACION MOVIL (Ancho 100% adaptable) */
        @media screen and (max-width: 767px) {
            .player-card {
                width: 100%;
                max-width: 100%;
                padding: 8px;
                border-radius: 18px;
            }

            .video-box {
                border-radius: 12px;
            }

            .video-box video {
                border-radius: 12px;
            }
        }

        /* Texto inferior */
        .footer-tag {
            margin-top: 20px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Canvas de fondo para animacion de globos -->
    <canvas id="balloon-canvas"></canvas>

    <!-- Contenedor Principal -->
    <div class="main-wrapper">
        <h1 class="header-title">Feliz Cumpleanos</h1>

        <!-- Contenedor del Video (Max 720px PC / 100% Movil) -->
        <div class="player-card">
            <div class="video-box">
                <video 
                    src="https://xatspace.github.io/space/kane/kane.mp4" 
                    controls 
                    autoplay 
                    loop 
                    playsinline 
                    muted>
                    Tu navegador no soporta videos HTML5.
                </video>
            </div>
        </div>

        <div class="footer-tag">Que pases un dia inolvidable</div>
    </div>

    <!-- Script para Lluvia de Globos Pastel -->
    <script>
        const canvas = document.getElementById('balloon-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const pastelColors = [
            'rgba(255, 183, 178, ',
            'rgba(255, 218, 193, ',
            'rgba(226, 240, 203, ',
            'rgba(181, 234, 215, ',
            'rgba(199, 206, 234, ',
            'rgba(255, 204, 229, '
        ];

        class Balloon {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : height + Math.random() * 100 + 20;
                this.radius = Math.random() * 14 + 16;
                this.speed = Math.random() * 0.8 + 0.6;
                this.swing = Math.random() * 0.03 + 0.01;
                this.swingOffset = Math.random() * Math.PI * 2;
                this.colorBase = pastelColors[Math.floor(Math.random() * pastelColors.length)];
                this.alpha = Math.random() * 0.4 + 0.5;
                this.stringLength = this.radius * 2.2;
            }

            update() {
                this.y -= this.speed;
                this.swingOffset += this.swing;
                this.x += Math.sin(this.swingOffset) * 0.6;

                if (this.y + this.radius < -50) {
                    this.reset(false);
                }
            }

            draw() {
                ctx.save();
                
                // Hilo
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + this.radius);
                ctx.lineTo(this.x + Math.sin(this.swingOffset) * 5, this.y + this.radius + this.stringLength);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                // Globo
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, this.radius * 0.85, this.radius, 0, 0, Math.PI * 2);
                ctx.fillStyle = this.colorBase + this.alpha + ')';
                ctx.fill();

                // Brillo
                ctx.beginPath();
                ctx.ellipse(
                    this.x - this.radius * 0.3, 
                    this.y - this.radius * 0.3, 
                    this.radius * 0.25, 
                    this.radius * 0.15, 
                    -Math.PI / 4, 0, Math.PI * 2
                );
                ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                ctx.fill();

                // Nudo
                ctx.beginPath();
                ctx.moveTo(this.x - 3, this.y + this.radius);
                ctx.lineTo(this.x + 3, this.y + this.radius);
                ctx.lineTo(this.x, this.y + this.radius + 4);
                ctx.closePath();
                ctx.fillStyle = this.colorBase + (this.alpha + 0.1) + ')';
                ctx.fill();

                ctx.restore();
            }
        }

        const balloonCount = Math.floor(Math.min(window.innerWidth / 20, 35));
        const balloons = Array.from({ length: balloonCount }, () => new Balloon());

        function animate() {
            ctx.clearRect(0, 0, width, height);
            balloons.forEach(balloon => {
                balloon.update();
                balloon.draw();
            });
            requestAnimationFrame(animate);
        }

        window.onload = () => {
            animate();

            const video = document.querySelector('video');
            if (video) {
                video.play().catch(() => {
                    video.muted = true;
                    video.play();
                });
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marbella XatSpace</title>
    <link rel="SHORTCUT ICON" href="https://xatimg.com/image/K0omsEWnsHvq.gif">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            background: #2a0b16; 
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .bg-photos {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            background-image: url('https://xatimg.com/image/4HyF6Ux9IccH.png'); 
            background-size: auto 100vh;
            background-repeat: no-repeat;
            background-position: right center;
            opacity: 0.9;
            pointer-events: none;
        }

        .heart-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            animation: fall linear infinite;
            opacity: 0;
        }

        @keyframes fall {
            0% { top: -10%; transform: translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            80% { opacity: 0.6; }
            100% { top: 100%; transform: translateX(50px) rotate(360deg); opacity: 0; }
        }

        /* Estilo base PC */
        body {
            display: flex;
            justify-content: center; 
            align-items: center;
        }

        .glass-panel {
            background: rgba(25, 5, 12, 0.45); 
            border-radius: 25px;
            padding: 18px 28px 15px; 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 183, 197, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: max-content;
            max-width: 90vw;
            position: relative;
            z-index: 10;
            transform: translateY(-220px);
            transition: transform 0.2s ease;
        }

        .header-flex {
            display: flex;
            align-items: center;
            justify-content: center; 
            margin-bottom: 10px;
            width: 100%;
        }

        .user-info {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }

        .name-marbella {
            font-family: 'Cinzel Decorative', serif;
            font-size: 50px; 
            color: #ffb7c5; 
            text-transform: uppercase;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            line-height: 1;
            z-index: 2;
            text-align: center;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .phrase-container {
            border-top: 1px solid rgba(255, 183, 197, 0.15);
            padding-top: 10px;
            text-align: center;
        }

        .book-text {
            font-family: 'Montserrat', sans-serif; 
            font-size: 13px; 
            letter-spacing: 1px;
            color: #fff0f3; 
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.95); 
            white-space: nowrap;
        }

        /* Nota musical fija abajo a la derecha */
        .music-footer-icon {
            position: fixed;
            bottom: 20px;
            right: 25px;
            font-size: 22px;
            color: #ffb7c5;
            opacity: 0.7;
            transition: all 0.3s ease;
            cursor: pointer;
            z-index: 99;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .music-footer-icon:hover {
            opacity: 1;
            transform: scale(1.3);
            text-shadow: 0 0 15px #ffb7c5;
        }

        .sprout-heart {
            position: absolute;
            color: #ffb7c5;
            pointer-events: none;
            z-index: 1;
            font-size: 15px;
            animation: sproutUp 3s ease-out forwards;
            opacity: 0;
        }

        @keyframes sproutUp {
            0% { transform: translateY(0) scale(0); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: var(--translateSprout) scale(1.2); opacity: 0; }
        }

        /* --- DETALLES ELEGANTES Y ROMÁNTICOS EXCLUSIVOS PARA PC --- */
        @media (min-width: 651px) {
            .glass-panel {
                border: 1.5px solid rgba(255, 183, 197, 0.5);
                box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65), 0 0 30px rgba(255, 183, 197, 0.2);
                background: rgba(30, 6, 15, 0.5);
            }

            .name-marbella {
                animation: luxuryGlow 3.5s ease-in-out infinite alternate;
            }

            @keyframes luxuryGlow {
                0% { 
                    color: #ffb7c5;
                    text-shadow: 2px 2px 10px rgba(0,0,0,0.9), 0 0 6px rgba(255, 183, 197, 0.3); 
                }
                100% { 
                    color: #fff0f3;
                    text-shadow: 2px 2px 18px rgba(0,0,0,0.95), 0 0 22px rgba(255, 183, 197, 0.7), 0 0 10px rgba(255, 105, 180, 0.4); 
                }
            }
        }

        /* PC achicando navegador (Mueve hacia la izquierda con translateX y ajusta altura con translateY en conjunto) */
        @media (max-width: 1400px) and (min-width: 651px) {
            .glass-panel {
                transform: translate(-140px, -220px); 
            }
        }
        @media (max-width: 1100px) and (min-width: 651px) {
            .glass-panel {
                transform: translate(-210px, -220px); 
            }
        }
        @media (max-height: 700px) and (min-width: 651px) {
            .glass-panel {
                transform: translate(0px, -130px); 
            }
        }
        @media (max-height: 550px) and (min-width: 651px) {
            .glass-panel {
                transform: translate(0px, -60px); 
            }
        }

        /* Modo móvil / pantallas verticales (100% INTACTO TAL CUAL LO PASASTE) */
        @media (max-width: 650px), (orientation: portrait) {
            body {
                align-items: flex-end !important;
                padding-bottom: 50px !important;
                background: #1a0a1a !important;
            }
            .bg-photos {
                background-image: url('https://xatimg.com/image/N3SH6uRtE4zg.png') !important;
                background-size: cover !important;
                background-position: center center !important;
                opacity: 0.8 !important;
            }
            .glass-panel {
                transform: none !important;
                width: max-content !important;
                max-width: 90vw !important;
                padding: 12px 18px 10px !important;
                margin-left: 0 !important;
            }
            .name-marbella {
                font-size: 30px !important;
                letter-spacing: 1px !important;
            }
            .book-text {
                font-size: 10px !important;
                letter-spacing: 0.5px !important;
            }
        }
    </style>
</head>
<body onclick="handleFirstClick()">

    <!-- Audio de fondo original -->
    <audio id="bg-audio" src="https://xatspace.github.io/space/music/YahariMensajeEnLaLuna.mp3" preload="auto" loop></audio>

    <div class="bg-photos"></div>
    <div class="heart-container" id="heart-container"></div>

    <div class="glass-panel">
        <div class="header-flex">
            <div class="user-info" id="name-box">
                <h1 class="name-marbella">MARBELLA</h1>
            </div>
        </div>

        <div id="phrase-content" class="phrase-container">
            <p class="book-text">
                no compito con nadie soy mi propio brillo
            </p>
        </div>
    </div>

    <!-- Nota musical afuera, abajo a la derecha de la pantalla -->
    <i class="fas fa-music music-footer-icon" title="Yahari Mensaje En La Luna"></i>

    <script>
        let started = false;

        // Reproduce el audio al primer clic en cualquier parte del documento
        function handleFirstClick() {
            if (!started) {
                const audio = document.getElementById('bg-audio');
                audio.play().catch(error => {
                    console.log("Reproducción bloqueada o fallida:", error);
                });
                started = true;
            }
        }

        // Efectos de ambiente (corazones saliendo del nombre)
        setInterval(() => {
            const wrap = document.getElementById('name-box');
            if(wrap){
                const heart = document.createElement('div');
                heart.classList.add('sprout-heart');
                heart.innerHTML = '❤';
                heart.style.left = (Math.random() * 60 + 20) + '%';
                heart.style.top = (Math.random() * 50 + 20) + '%';
                const tx = (Math.random() - 0.5) * 80 + 'px'; 
                const ty = (Math.random() * -60 - 40) + 'px'; 
                heart.style.setProperty('--translateSprout', `translate(${tx}, ${ty})`);
                wrap.appendChild(heart);
                setTimeout(() => heart.remove(), 3000);
            }
        }, 600);

        // Lluvia de corazones de fondo
        setInterval(() => {
            const container = document.getElementById('heart-container');
            if(container){
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤';
                heart.style.left = Math.random() * 100 + 'vw';
                const duration = Math.random() * 5 + 5;
                heart.style.animationDuration = duration + 's';
                container.appendChild(heart);
                setTimeout(() => heart.remove(), duration * 1000);
            }
        }, 450);
    </script>
</body>
</html>

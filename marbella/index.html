<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marbella XatSpace</title>
    <link rel="SHORTCUT ICON" href="https://xatimg.com/image/K0omsEWnsHvq.gif">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@1,600&family=Montserrat:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding-left: calc(50vw - 220px - 250px);
            overflow: hidden;
            position: relative;
            background: #1a0a1a;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
        }

        .bg-photos {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            background-image: url('https://xatimg.com/image/xrt03AgF6Cqj.png');
            background-size: cover;
            background-position: center;
            opacity: 0.8;
            pointer-events: none;
        }

        @media (max-width: 500px) or (orientation: portrait) {
            body {
                justify-content: center;
                align-items: flex-end;
                padding-left: 0;
                padding-bottom: 30px;
            }
            .bg-photos {
                background-image: url('https://xatimg.com/image/zGn2C9hpAAUw.png');
                background-position: center center;
            }
            .glass-panel {
                transform: none !important;
            }
        }

        .heart-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            animation: fall linear infinite;
            opacity: 0;
        }

        @keyframes fall {
            0% { top: -10%; transform: translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            80% { opacity: 0.6; }
            100% { top: 100%; transform: translateX(50px) rotate(360deg); opacity: 0; }
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 40px;
            padding: 20px 25px 15px; 
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            max-width: 440px;
            width: 95%;
            position: relative;
            z-index: 10;
            transform: translateY(-50px);
        }

        .header-flex {
            display: flex;
            align-items: center;
            justify-content: center; 
            margin-bottom: 10px;
            width: 100%;
        }

        .user-info {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }

        .name-aloe {
            font-family: 'Cinzel Decorative', serif;
            font-size: 45px; 
            color: #ffb7c5; 
            text-transform: uppercase;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            line-height: 1;
            z-index: 2;
            text-align: center;
        }

        .phrase-container {
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 10px;
            text-align: center;
        }

        .book-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 19px;
            line-height: 1.3;
            color: #ffffff;
            font-style: italic;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }

        /* Nota musical FUERA del cuadro, abajo del todo a la derecha de la pantalla */
        .music-footer-icon {
            position: fixed;
            bottom: 20px;
            right: 25px;
            font-size: 22px;
            color: #ffb7c5;
            opacity: 0.7;
            transition: all 0.3s ease;
            cursor: pointer;
            z-index: 99;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .music-footer-icon:hover {
            opacity: 1;
            transform: scale(1.3);
            text-shadow: 0 0 15px #ffb7c5;
        }

        .sprout-heart {
            position: absolute;
            color: #ffb7c5;
            pointer-events: none;
            z-index: 1;
            font-size: 15px;
            animation: sproutUp 3s ease-out forwards;
            opacity: 0;
        }

        @keyframes sproutUp {
            0% { transform: translateY(0) scale(0); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: var(--translateSprout) scale(1.2); opacity: 0; }
        }

        @media (max-width: 500px) {
            .name-aloe { font-size: 33px; }
            .glass-panel { padding: 18px 20px; }
        }
    </style>
</head>
<body onclick="handleFirstClick()">

    <!-- Audio invisible de fondo -->
    <audio id="bg-audio" src="https://xatspace.github.io/space/music/YahariMensajeEnLaLuna.mp3" preload="auto" loop></audio>

    <div class="bg-photos"></div>
    <div class="heart-container" id="heart-container"></div>

    <div class="glass-panel">
        <div class="header-flex">
            <div class="user-info" id="name-box">
                <h1 class="name-aloe">MARBELLA</h1>
            </div>
        </div>

        <div id="phrase-content" class="phrase-container">
            <p class="book-text" style="font-weight: bold; margin-bottom: 2px; text-transform: uppercase;">
                no compito con nadie soy mi propio brillo
            </p>
        </div>
    </div>

    <!-- Nota musical afuera, abajo a la derecha de la pantalla -->
    <i class="fas fa-music music-footer-icon" title="Yahari Mensaje En La Luna"></i>

    <script>
        let started = false;

        // Reproduce el audio al primer clic en cualquier parte del documento
        function handleFirstClick() {
            if (!started) {
                const audio = document.getElementById('bg-audio');
                audio.play().catch(error => {
                    console.log("Reproducción bloqueada o fallida:", error);
                });
                started = true;
            }
        }

        // Efectos de ambiente (corazones saliendo del nombre)
        setInterval(() => {
            const wrap = document.getElementById('name-box');
            if(wrap){
                const heart = document.createElement('div');
                heart.classList.add('sprout-heart');
                heart.innerHTML = '❤';
                heart.style.left = (Math.random() * 60 + 20) + '%';
                heart.style.top = (Math.random() * 50 + 20) + '%';
                const tx = (Math.random() - 0.5) * 80 + 'px'; 
                const ty = (Math.random() * -60 - 40) + 'px'; 
                heart.style.setProperty('--translateSprout', `translate(${tx}, ${ty})`);
                wrap.appendChild(heart);
                setTimeout(() => heart.remove(), 3000);
            }
        }, 600);

        // Lluvia de corazones de fondo
        setInterval(() => {
            const container = document.getElementById('heart-container');
            if(container){
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤';
                heart.style.left = Math.random() * 100 + 'vw';
                const duration = Math.random() * 5 + 5;
                heart.style.animationDuration = duration + 's';
                container.appendChild(heart);
                setTimeout(() => heart.remove(), duration * 1000);
            }
        }, 450);
    </script>
</body>
</html>
